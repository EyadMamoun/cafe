<div class="container">
    <form [formGroup]="loginForm" (ngSubmit)="login()">
        <div class="row login-container">
            <span class="header-style">LOGIN NOW</span>
            <div class="col-12 col-md-4">
                <app-generic-input [label]="'Email'" [inputType]="'email'" [formControlName]="'email'" />
            </div>
            <div class="col-12 col-md-4">
                <app-generic-input [label]="'Password'" [inputType]="'password'" [formControlName]="'password'" />
            </div>
            <div class="col-3 col-md-1 btn-container">
                <button class="btn login-btn" type="submit">Login</button>
            </div>
            <div class="col-12 disclamer">
                <span>Don't have an account yet?! </span>
                <a routerLink="/register">Register Now</a>
            </div>
        </div>
    </form>
</div>
