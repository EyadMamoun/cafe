<div class="container">
    <div class="row overall-container">
        <span class="header-style">OUR SHOP</span>
        @for(product of coffeeProducts; track $index){
        <div class="col-6 col-md-3 products-alignment">
            <app-product-card [imgSrc]="product.image" [imgAlt]="'coffee product'" [productName]="product.title"
                [productDescription]="product.description" [productPrice]="product.price" [normalProduct]="true"
                [selectedProduct]="product" />
        </div>
        }
    </div>
</div>

@if(subtotal != 0 && showSubtotal){
<app-subtotal (close)="closeSubtotal()" />
}
